<!doctype html>

    <!-- M6 (re-audit 2026-11-15): the AdSense script + GA4 gtag snippet are
         NO LONGER static tags here — src/utils/thirdParty.ts injects them
         dynamically before the app mounts, skipping /admin/comments/. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('compressmypic_theme');
          var isDark =
            pref === 'dark' ||
            ((!pref || pref === 'system') &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <title>Free Image Compressor – Compress Images Online, No Signup</title>

    <!-- Google Web Fonts: Inter for headings/UI/body, JetBrains Mono for technical values, Great Vibes for the footer credit names.
         All three load non-blocking via the media=print trick (Week-2 speed
         work, audit H3: the Inter/JetBrains stylesheet was render-blocking,
         898–1,852ms wasted). The onload handler flips media to 'all' once
         the CSS arrives, so the fonts apply with font-display: swap and no
         render-blocking fetch. Great Vibes was already async (quick wins);
         do not make it blocking again. The prerender (scripts/prerender.cjs)
         resets any media="all" the snapshot captured back to "print". -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" /></noscript>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
